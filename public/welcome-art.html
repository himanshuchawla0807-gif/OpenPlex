<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenPlex garden</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f1e4}.art{height:100%;width:100%;position:relative;background:url('/illustrations/openplex-garden.png') center/cover;display:flex;align-items:flex-end}.art::before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 60%,#51405073)}.garden-caption{width:max-content;max-width:calc(100% - 64px);margin:0 32px 32px;padding:25px 30px;color:#fff8ed;font-family:Georgia,serif;flex-shrink:0}.garden-caption small{font:10px ui-monospace,monospace;letter-spacing:2.4px}.garden-caption h1{font:normal 34px/1.2 Georgia,serif;letter-spacing:-.6px;margin:15px 0 0;text-shadow:0 1px 8px #30233466}.diagram{position:absolute;top:25px;left:28px;right:28px;background:#f6f1e4;border-radius:24px;padding:12px 8px 24px;text-align:center;max-height:calc(100% - 230px);overflow:hidden;display:none}.diagram img{display:block;width:100%;max-height:calc(100vh - 300px)}.diagram p{font:20px Georgia,serif;color:#514050;margin:6px 0 0}@media(max-width:480px){.garden-caption{margin:0 22px 24px;width:max-content;max-width:calc(100% - 44px);padding:22px 26px}.garden-caption h1{font-size:29px}.diagram{left:20px;right:20px}.diagram p{font-size:17px}}
</style></head><body><main class="art"><section class="diagram" id="diagram"><img src="/illustrations/department-campus.svg" alt="Main office connected to six furnished departments"><p>A place for every department.</p></section><section class="garden-caption"><small id="eyebrow">ROOM TO GROW</small><h1 id="title">Good ideas need<br>a little space.</h1></section></main><script>
const step=Math.max(0,Math.min(2,Number(new URLSearchParams(location.search).get('step'))||0));document.querySelector('#eyebrow').textContent=['ROOM TO GROW','BETTER TOGETHER','A WORKDAY WITH CHARACTER'][step];document.querySelector('#title').innerHTML=['Good ideas need<br>a little space.','Your main office.<br>Everything around it.','Make yourself<br>at home.'][step];document.querySelector('#diagram').style.display=step===1?'block':'none';
</script></body></html>
